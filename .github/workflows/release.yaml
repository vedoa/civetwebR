name: release

on:
  push:
    branches: [production]
  workflow_dispatch:

env:
  GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
  R_KEEP_PKG_SOURCE: yes

jobs:
  build:
    runs-on: ${{ matrix.config.os }}
    name: build-${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macOS-latest,   type: binary}
          - {os: windows-latest, type: binary}
          - {os: ubuntu-latest,  type: source}

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2

      - uses: r-lib/actions/setup-r-dependencies@v2

      - name: Build package
        run: |
          if ("${{ matrix.config.type }}" == "source") {
            system("R CMD build .")
          } else {
            if (!require("pkgbuild")) install.packages("pkgbuild")
            pkgbuild::build(binary = TRUE, dest_path = ".")
          }
        shell: Rscript {0}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.config.os }}
          path: civetwebR_*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Extract version
        run: echo "PKG_VERSION=$(grep '^Version:' DESCRIPTION | awk '{print $2}')" >> $GITHUB_ENV

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.PKG_VERSION }}
          name: civetwebR v${{ env.PKG_VERSION }}
          files: release-artifacts/civetwebR_*
          generate_release_notes: true
          draft: false
          prerelease: false